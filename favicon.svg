<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DA"/>
      <stop offset="20%" stop-color="#ECC87C"/>
      <stop offset="45%" stop-color="#C59E50"/>
      <stop offset="70%" stop-color="#8F6E2E"/>
      <stop offset="85%" stop-color="#D4AF63"/>
      <stop offset="100%" stop-color="#FBF0D0"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC87C"/>
      <stop offset="50%" stop-color="#FFF7E6"/>
      <stop offset="100%" stop-color="#C59E50"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="30%" stop-color="#BFA06B"/>
      <stop offset="60%" stop-color="#7A5D25"/>
      <stop offset="85%" stop-color="#D9B774"/>
      <stop offset="100%" stop-color="#FFF5DA"/>
    </linearGradient>

    <!-- Deep Luxury Obsidian Slate Background -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#1B2226"/>
      <stop offset="65%" stop-color="#101518"/>
      <stop offset="100%" stop-color="#080B0C"/>
    </radialGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Luxury Dark Badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Outer Double Concentric Gold Rim -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#goldRim)" stroke-width="8"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldRim)" stroke-width="2.5" opacity="0.9"/>

  <!-- Houston Skyline Silhouette within Lower Root Arch -->
  <g id="skyline" opacity="0.95">
    <!-- Center spire building -->
    <rect x="249" y="328" width="14" height="66" fill="url(#goldLinear)" rx="1.5"/>
    <polygon points="256,312 249,328 263,328" fill="url(#goldBright)"/>
    <!-- Left tower -->
    <rect x="238" y="348" width="9" height="46" fill="url(#goldLinear)" rx="1"/>
    <!-- Right tower -->
    <rect x="265" y="342" width="9" height="52" fill="url(#goldLinear)" rx="1"/>
    <!-- Far left stepped accent -->
    <rect x="229" y="362" width="7" height="32" fill="url(#goldLinear)" rx="1" opacity="0.75"/>
    <!-- Far right stepped accent -->
    <rect x="276" y="358" width="7" height="36" fill="url(#goldLinear)" rx="1" opacity="0.75"/>
  </g>

  <!-- Stylized Metallic Tooth Crown & Root Geometry -->
  <path d="M166,192 C158,154 186,132 216,136 C236,138 248,152 256,154 C264,152 276,138 296,136 C326,132 354,154 346,192 C340,224 350,268 338,324 C330,364 308,400 292,400 C274,400 270,364 266,336 C262,310 250,310 246,336 C242,364 238,400 220,400 C204,400 182,364 174,324 C162,268 172,224 166,192 Z"
        fill="url(#goldLinear)"
        stroke="url(#goldBright)"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Inner Molar Negative Contour / Depth Arch -->
  <path d="M228,396 C236,364 240,326 248,318 C252,314 260,314 264,318 C272,326 276,364 284,396 C274,386 266,378 256,378 C246,378 238,386 228,396 Z"
        fill="#0E1315"
        stroke="url(#goldRim)"
        stroke-width="3"/>

  <!-- Elegant Sweeping Dynamic Gold Swoosh Arc Wrapping Across the Tooth -->
  <path d="M136,328 C144,286 172,254 220,238 C272,220 338,206 384,178 C394,172 388,162 376,166 C324,186 254,204 196,226 C152,242 124,276 116,322 C114,334 134,340 136,328 Z"
        fill="url(#goldBright)"
        filter="url(#sparkleGlow)"/>

  <!-- Upper Crown Accent Highlight Contour -->
  <path d="M188,162 C206,150 234,158 256,168 C278,158 306,150 324,162 C332,168 338,158 330,152 C310,138 284,142 256,154 C228,142 202,138 182,152 C174,158 180,168 188,162 Z"
        fill="url(#goldBright)"/>

  <!-- Base Horizon Arc -->
  <path d="M162,408 C198,398 256,396 314,398 C350,408 358,414 348,414 C300,404 256,402 212,404 C164,414 152,414 162,408 Z"
        fill="url(#goldRim)"/>

  <!-- Radiant 4-Point Sparkle Star at Swoosh Peak -->
  <g transform="translate(378, 168)" filter="url(#sparkleGlow)">
    <!-- Outer Glow Diamond -->
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="url(#goldBright)"/>
    <!-- Diagonal smaller rays -->
    <path d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z" fill="#FFFFFF" transform="rotate(45)"/>
    <!-- Bright White Central Core Flare -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
